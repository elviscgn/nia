name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

  rust:
    name: Rust core
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup native build tools
        run: zsh scripts/setup-macos.sh

      - name: Regenerate lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error

  macos-bundle:
    name: macOS app bundle
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, rust]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup native build tools
        run: zsh scripts/setup-macos.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: pnpm tauri build --bundles app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: nia-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
