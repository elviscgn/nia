<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Nia</title>
  </head>
  <body>
    <div id="root"></div>
    <pre id="nia-boot-error" hidden style="font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; padding: 24px; color: #2b2926; margin: 0;"></pre>
    <script type="module">
      const fallback = document.getElementById("nia-boot-error");
      const sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
      const showBootError = (error) => {
        if (!fallback) return;
        const detail = error instanceof Error
          ? `${error.name}: ${error.message}\n\n${error.stack || ""}`
          : String(error || "Unknown frontend boot error");
        fallback.textContent = `Nia frontend did not mount.\n\n${detail}`;
        fallback.hidden = false;
      };

      window.addEventListener("error", (event) => showBootError(event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => showBootError(event.reason));

      let bootError = null;
      for (let attempt = 0; attempt < 24; attempt += 1) {
        try {
          await import(`/src/main.tsx?niaBoot=${attempt}`);
          bootError = null;
          break;
        } catch (error) {
          bootError = error;
          if (attempt < 23) await sleep(250);
        }
      }

      if (bootError) {
        showBootError(bootError);
      } else {
        window.setTimeout(() => {
          if (!document.querySelector(".app")) {
            showBootError(new Error("frontend module loaded but React did not mount"));
          }
        }, 1500);
      }
    </script>
  </body>
</html>
